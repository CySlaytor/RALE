name: Build and Package

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 (MSVC 2022 + Qt 6)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt@v3
        with:
          version: '6.11.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats qtsvg'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt Dependencies (windeployqt)
        shell: pwsh
        run: |
          $binDir = "build/Release"
          $exePath = "$binDir/RALogicEditor.exe"

          if (-not (Test-Path $exePath)) {
            Write-Error "Executable not found at $exePath"
            exit 1
          }

          # Run windeployqt
          & "${{ env.Qt6_DIR }}/bin/windeployqt.exe" `
            --no-compiler-runtime `
            --no-opengl-sw `
            --no-translations `
            --plugindir "$binDir/plugins" `
            $exePath

          # Clean up unnecessary heavy shader DLLs
          Remove-Item -Path "$binDir/dxcompiler.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$binDir/dxil.dll" -ErrorAction SilentlyContinue
          Remove-Item -Path "$binDir/D3Dcompiler_47.dll" -ErrorAction SilentlyContinue

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RALogicEditor-Windows-x64
          path: |
            build/Release/
            !build/Release/*.obj
            !build/Release/*.pdb
            !build/Release/*.ilk
            !build/Release/*.exp
            !build/Release/*.lib
          if-no-files-found: error
